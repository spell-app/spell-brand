<!doctype html>
<!--
  Brand UI's footer, shared by every page:  the layout's `<ui-include class="site-footer" source="footer.html"
  page-styles load="visible">` (`__parts/layout.html`), shaped like Epic UI's (`epic/src/docs/__parts/footer.html`).
  - Relative links are rewritten against THIS file as served (`/components/brand/__parts/`) by `<ui-include>`:  the
    set's pages are `../x.html`, the checkout's root `../../../`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brand UI site footer</title>
  </head>
  <body>
    <ui-segment appearance="vertical" class="site-footer-segment">
      <ui-container>
        <ui-grid stackable columns="3">
          <ui-column>
            <ui-header level="4">Brand UI</ui-header>
            <ui-list appearance="link">
              <ui-item link="/components/brand/index.html" icon="wand magic sparkles">The Brand Elements</ui-item>
              <ui-item link="/components/brand/brand-logo.html" icon="hat wizard">The logo</ui-item>
              <ui-item link="/components/brand/brand-color-picker.html" icon="palette">The colour picker</ui-item>
            </ui-list>
          </ui-column>
          <ui-column>
            <ui-header level="4">Brand</ui-header>
            <ui-list appearance="link">
              <ui-item link="/brand/index.html" icon="swatchbook">The Brand tab</ui-item>
              <ui-item link="/guides/design-system/design-system.html" icon="book open">The Design System</ui-item>
            </ui-list>
          </ui-column>
          <ui-column>
            <ui-header level="4">Project</ui-header>
            <ui-list appearance="link">
              <ui-item link="https://github.com/spell-app/spell-brand" icon="github">GitHub repository</ui-item>
              <ui-item link="https://github.com/spell-app/spell-brand/tree/main/src/components" icon="code">
                Source of the brand pack
              </ui-item>
              <ui-item link="https://github.com/spell-app/spell-brand/tree/main/docs" icon="code">
                Source of these pages
              </ui-item>
            </ui-list>
          </ui-column>
        </ui-grid>
        <ui-divider section></ui-divider>
        <ui-list direction="horizontal" divided appearance="link" size="small">
          <ui-item>Brand UI: the <code>&lt;brand-*&gt;</code> elements the Brand tab's pages are built from</ui-item>
          <ui-item>Spell UI's page shape, on Spell UI's site bundle</ui-item>
        </ui-list>
      </ui-container>
    </ui-segment>
  </body>
</html>
