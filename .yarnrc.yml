# spell-brand's own install (epic `repo-split` P20):  a project beside the kit, using `spell` as any other project
# would (`"spell": "portal:../spell"` in package.json).
# - Its own yarn release (`yarnPath`) and lockfile:  the kit's install no longer covers it.
# - The kit's settings, and its catalog of tool versions:  bump them together (vite-plus and every `catalog:` entry).
approvedGitRepositories:
  - "**"

enableGlobalCache: true

enableScripts: true

nodeLinker: node-modules

# Hoist everything to the root `node_modules`, so there's ONE physical copy of each package version -- above all
# Solid, whose reactivity (owners, context, signals) breaks when two copies load.  Pinned by `resolutions`.
# - `spell` is a portal into the kit:  its own files find their packages in the KIT's install, from where they really
#   are, so Vite and Vitest dedupe Solid (`baseConfig()`, the kit's `SOLID_DEDUPE`) to keep one copy on a page.
# Tools find each other through `<package>/node_modules/.bin/*` (still created per package) or by resolving from
# the root;  NEVER hardcode `<package>/node_modules/<dep>`.  Set explicitly (not just omitted) so a parent folder's
# `.yarnrc.yml` -- e.g. a worktree nested inside another checkout -- can't impose a limit.
nmHoistingLimits: none

npmMinimalAgeGate: 0

yarnPath: .yarn/releases/yarn-4.18.0.cjs

npmPreapprovedPackages:
  - vitest
  - "@vitest/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
  "@vitest/browser-playwright": 5.0.1
  "@vitest/coverage-v8": 5.0.1
  "@vitest/ui": 5.0.1
